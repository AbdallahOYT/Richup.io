
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.richup.wrapper'
    compileSdk 35

    defaultConfig {
        applicationId 'io.richup.wrapper'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation "androidx.browser:browser:1.8.0"
}
